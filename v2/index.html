<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ece7dc" />
    <title>Agentic Coding — a field guide (v2)</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ece7dc'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%231b1a17' stroke-width='2'/%3E%3Cpath d='M16 3v7' stroke='%231f8a56' stroke-width='3'/%3E%3C/svg%3E" />
    <meta name="description" content="An interactive, spatial field guide to agentic coding — concepts as living 3D models, and two real builds replayed from their screenshots." />
    <!--
      Same GitHub Pages deep-link decoding as the root index.html: 404.html
      re-encodes /v2/<section>/<step> into /v2/?/<section>/<step> and this
      restores it before the v2 router reads location.pathname.
      See docs/adr/0002-pushstate-routing-with-404-fallback.md.
    -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      This version of the guide needs JavaScript. The original, text-first
      version lives at <a href="../">the guide's front page</a>.
    </noscript>
    <script type="module" src="/src/v2/main.ts"></script>
  </body>
</html>
